<!--
  Paste this into a Squarespace "Code" block (Edit page → + → Code).
  Replace YOUR-SITE.netlify.app with your Netlify address.
  The iframe resizes itself to fit the coupon list.
-->
<iframe
  id="couponing"
  src="https://YOUR-SITE.netlify.app/"
  title="Coupons and promo codes"
  style="width:100%;height:1400px;border:0;display:block;"
  allow="clipboard-write"
  loading="lazy"></iframe>
<script>
  window.addEventListener("message", function (e) {
    if (!e.data || e.data.type !== "couponing:height") return;
    if (e.origin.indexOf(".netlify.app") === -1 && e.origin.indexOf("YOUR-CUSTOM-DOMAIN") === -1) return;
    document.getElementById("couponing").style.height = e.data.height + "px";
  });
</script>
