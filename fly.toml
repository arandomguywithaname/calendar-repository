# Fly.io config for the digest bot.
#
# The [http_service] exists for exactly one route: the MCP connector that lets
# the person's own claude.ai read their digests. The bot's real work is still
# the Telegram long poll, which is why the auto-stop machinery is pinned off —
# a machine stopped "because no HTTP traffic" would also stop polling Telegram,
# and the bot would look dead precisely when nobody was using the connector.

app = "telereader"
primary_region = "lhr"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[env]
  DIGEST_DATA_DIR = "/data"
  DIGEST_INTERVAL_HOURS = "6"

# Digests and the MTProto session live here. Without this volume a redeploy
# wipes the session and everyone has to sign in again.
[mounts]
  source = "digest_data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
  # Exactly one. Two machines polling the same bot token fight over updates —
  # Telegram answers the second one with 409 and the bot stops rather than
  # silently dropping half the messages.
  processes = ["app"]
