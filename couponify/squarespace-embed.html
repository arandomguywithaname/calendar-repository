<!--
  Paste this into a Squarespace "Code" block (Edit page → + → Code).
  Replace YOUR-SITE.netlify.app with your Netlify address (or your custom domain).
  The iframe resizes itself to fit the coupon list.
-->
<iframe
  id="couponify"
  src="https://YOUR-SITE.netlify.app/"
  title="Coupons and promo codes"
  style="width:100%;height:1400px;border:0;display:block;"
  allow="clipboard-write"></iframe>
<script>
  (function () {
    var frame = document.getElementById("couponify");
    window.addEventListener("message", function (e) {
      // Only listen to our own iframe.
      if (e.source !== frame.contentWindow || !e.data || e.data.type !== "couponify:height") return;
      var h = Number(e.data.height);
      if (h > 0 && h < 100000) frame.style.height = h + "px";
    });
  })();
</script>
