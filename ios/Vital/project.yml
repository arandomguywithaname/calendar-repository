# XcodeGen spec — run `xcodegen generate` in this folder to produce Vital.xcodeproj.
# Install XcodeGen with: brew install xcodegen
name: Vital
options:
  bundleIdPrefix: com.CHANGEME.family   # ← set your own reverse-domain prefix
targets:
  Vital:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources: [Sources]
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Vital
        UILaunchScreen: {}
        NSHealthShareUsageDescription: >-
          Vital reads the health data you approve (sleep, heart, activity,
          workouts) and sends it only to your family's own server.
    entitlements:
      path: Vital.entitlements
      properties:
        com.apple.developer.healthkit: true
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.9"
