# XcodeGen spec — run `xcodegen generate` in this folder to produce Vital.xcodeproj.
# Install XcodeGen with: brew install xcodegen
name: Vital
options:
  bundleIdPrefix: com.tim   # ← set your own reverse-domain prefix
targets:
  Vital:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources: [Sources, Assets.xcassets]
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Vital
        UILaunchScreen: {}
        NSHealthShareUsageDescription: >-
          Vital reads the health data you approve (sleep, heart, activity,
          workouts) and sends it only to your family's own server.
        # Apple rejects any upload from an app carrying the HealthKit
        # entitlement unless BOTH purpose strings exist (ITMS-90683), even
        # when the app only reads. Vital passes toShare: [] and never asks
        # for write access, so this string is never actually shown.
        NSHealthUpdateUsageDescription: >-
          Vital never writes to Apple Health. It only reads the data you
          approve, so it can be sent to your family's own server.
        # Optional zero-config for FAMILY builds: paste the connection link from
        # `npm run link` here before building, and installers never set anything up.
        VitalDefaultConnectionLink: ""
        # Optional for CUSTOMER builds: just the server's public address (safe to
        # commit — no secret). First launch then shows a Join button that signs
        # the person up in-app via /api/join.
        VitalServerURL: ""
        # Background refresh: iOS wakes the app between opens to send fresh
        # data. Timing is decided by iOS (best-effort, a few times a day).
        UIBackgroundModes: [fetch]
        BGTaskSchedulerPermittedIdentifiers: [app.vital.refresh]
        # App Store / TestFlight upload requirements: an icon must exist
        # (CFBundleIconName points at the asset catalog set), and declaring
        # standard-encryption-only skips the export-compliance prompt.
        CFBundleIconName: AppIcon
        ITSAppUsesNonExemptEncryption: false
    entitlements:
      path: Vital.entitlements
      properties:
        com.apple.developer.healthkit: true
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.9"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Version 1.0 build 1 by default; CI bumps the build number so each
        # TestFlight upload is unique (Apple rejects a repeated one).
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
