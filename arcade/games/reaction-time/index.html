<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>Reaction Time — Claude Arc Games</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚡</text></svg>">
<link rel="stylesheet" href="../../css/main.css?v=13">
<!-- mobile-meta -->
<meta name="theme-color" content="#0f1220">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ArcGames">
<link rel="manifest" href="../../manifest.json">
<link rel="apple-touch-icon" href="../../icons/icon-192.png">
<!-- /mobile-meta -->
<script>window.ARCADE_ROOT_DEPTH = 2;</script>
<style>
  #zone {
    width: min(480px, 90vw);
    height: 260px;
    border-radius: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.6rem;
    font-weight: 800;
    text-align: center;
    cursor: pointer;
    user-select: none;
    background: var(--panel-2);
    color: var(--text);
    border: 1px solid var(--border);
    transition: background 0.1s ease;
  }
  #zone.wait { background: var(--danger); color: white; box-shadow: 0 0 30px 4px rgba(255,93,93,0.4); }
  #zone.go {
    background: var(--good); color: #05131c;
    box-shadow: 0 0 70px 14px var(--good), 0 0 140px 30px rgba(41,224,201,0.5);
    animation: reactPulse 0.5s ease-in-out infinite;
  }
  @keyframes reactPulse {
    0%, 100% { transform: scale(1); box-shadow: 0 0 60px 10px var(--good), 0 0 120px 24px rgba(41,224,201,0.4); }
    50% { transform: scale(1.02); box-shadow: 0 0 90px 20px var(--good), 0 0 170px 40px rgba(41,224,201,0.6); }
  }
</style>
</head>
<body>
<main class="game-shell">
  <div class="game-topbar">
    <a class="back-link" href="../../index.html">← <span data-i18n="back.toArcade">Back to Arcade</span></a>
    <h1>⚡ Reaction Time</h1>
    <div class="hud">
      <span class="stat">Last: <b id="score">-</b> ms</span>
      <span class="stat"><span data-i18n="common.best">Best</span>: <b id="best">-</b> ms</span>
    </div>
  </div>
  <div class="game-stage">
    <div class="difficulty-row" id="difficulty"></div>
    <div id="zone">Click to start</div>
    <div id="result-banner"></div>
    <div class="controls-row">
      <button class="btn btn-primary" id="restart" data-i18n="common.restart">Restart</button>
    </div>
  </div>
  <p class="instructions">Click "Click to start", wait for the box to turn green, then click as fast as you can. Clicking too early restarts the round.</p>
</main>

<script src="../../i18n/en.js?v=13"></script>
<script src="../../i18n/es.js?v=13"></script>
<script src="../../i18n/ru.js?v=13"></script>
<script src="../../i18n/ro.js?v=13"></script>
<script src="../../i18n/fr.js?v=13"></script>
<script src="../../i18n/de.js?v=13"></script>
<script src="../../js/i18n.js?v=13"></script>
<script src="../../js/common.js?v=13"></script>
<script src="../../js/friends.js?v=13"></script>
<script src="../../js/mods.js?v=13"></script>
<script src="../../js/ai.js?v=13"></script>
<script src="../../js/admin.js?v=13"></script>
<script src="game.js"></script>
</body>
</html>
