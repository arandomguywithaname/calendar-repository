<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>Word Search — Claude Arc Games</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔍</text></svg>">
<link rel="stylesheet" href="../../css/main.css?v=13">
<!-- mobile-meta -->
<meta name="theme-color" content="#0f1220">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ArcGames">
<link rel="manifest" href="../../manifest.json">
<link rel="apple-touch-icon" href="../../icons/icon-192.png">
<!-- /mobile-meta -->
<script>window.ARCADE_ROOT_DEPTH = 2;</script>
<style>
  #ws-board { grid-template-columns: repeat(10, 32px); grid-template-rows: repeat(10, 32px); gap: 1px; user-select: none; touch-action: none; }
  #ws-board .cell { font-size: 0.85rem; border-radius: 2px; font-weight: 700; }
  #ws-board .cell.selecting { background: var(--accent-2); color: white; }
  #ws-board .cell.found { background: var(--good); color: #05131c; }
  #word-list { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; max-width: 480px; }
  #word-list .word-chip { padding: 4px 10px; border-radius: 999px; background: var(--panel-2); border: 1px solid var(--border); font-size: 0.82rem; font-weight: 700; }
  #word-list .word-chip.found { background: var(--good); color: #05131c; text-decoration: line-through; }
</style>
</head>
<body>
<main class="game-shell">
  <div class="game-topbar">
    <a class="back-link" href="../../index.html">← <span data-i18n="back.toArcade">Back to Arcade</span></a>
    <h1>🔍 Word Search</h1>
    <div class="hud">
      <span class="stat">Found: <b id="found-count">0</b>/<b id="total-count">0</b></span>
      <span class="stat"><span data-i18n="common.time">Time</span>: <b id="time">0</b></span>
      <span class="stat"><span data-i18n="common.best">Best</span>: <b id="best">-</b></span>
    </div>
  </div>
  <div class="game-stage">
    <div id="word-list"></div>
    <div class="grid-board" id="ws-board"></div>
    <div id="result-banner"></div>
    <div class="controls-row">
      <button class="btn btn-primary" id="restart" data-i18n="common.newGame">New Game</button>
    </div>
  </div>
  <p class="instructions">Click a letter then click the last letter of a word (or drag across it) to select a straight line. Find every word in the list to win.</p>
</main>

<script src="../../i18n/en.js?v=13"></script>
<script src="../../i18n/es.js?v=13"></script>
<script src="../../i18n/ru.js?v=13"></script>
<script src="../../i18n/ro.js?v=13"></script>
<script src="../../i18n/fr.js?v=13"></script>
<script src="../../i18n/de.js?v=13"></script>
<script src="../../js/i18n.js?v=13"></script>
<script src="../../js/common.js?v=13"></script>
<script src="../../js/friends.js?v=13"></script>
<script src="../../js/mods.js?v=13"></script>
<script src="../../js/ai.js?v=13"></script>
<script src="../../js/admin.js?v=13"></script>
<script src="game.js"></script>
</body>
</html>
