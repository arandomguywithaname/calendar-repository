<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>Reversi — Claude Arc Games</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚪</text></svg>">
<link rel="stylesheet" href="../../css/main.css?v=13">
<!-- mobile-meta -->
<meta name="theme-color" content="#0f1220">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ArcGames">
<link rel="manifest" href="../../manifest.json">
<link rel="apple-touch-icon" href="../../icons/icon-192.png">
<!-- /mobile-meta -->
<script>window.ARCADE_ROOT_DEPTH = 2;</script>
<style>
  #board { grid-template-columns: repeat(8, 42px); grid-auto-rows: 42px; gap: 3px; }
  #board .cell { background: #1c6b3a; font-size: 1.5rem; border-color: #0e4023; }
  #board .cell.valid::after {
    content: ""; display: block; width: 10px; height: 10px; border-radius: 50%;
    background: rgba(255,255,255,0.5);
  }
  #board .cell.valid { cursor: pointer; }
</style>
</head>
<body>
<main class="game-shell">
  <div class="game-topbar">
    <a class="back-link" href="../../index.html">← <span data-i18n="back.toArcade">Back to Arcade</span></a>
    <h1>⚪ Reversi</h1>
    <div class="hud">
      <span class="stat">You (⚫): <b id="black-score">2</b></span>
      <span class="stat">CPU (⚪): <b id="white-score">2</b></span>
      <span class="stat"><span data-i18n="common.best">Best</span>: <b id="best">0</b></span>
    </div>
  </div>
  <div class="game-stage">
    <div class="grid-board" id="board"></div>
    <div id="result-banner"></div>
    <div class="controls-row">
      <button class="btn btn-primary" id="restart" data-i18n="common.newGame">New Game</button>
    </div>
  </div>
  <p class="instructions">You play black. Click a highlighted cell to flip every white disc trapped in a line between your new disc and another black disc. Most discs on the board when no one can move wins.</p>
</main>

<script src="../../i18n/en.js?v=13"></script>

<script src="../../js/common.js?v=13"></script>
<script src="../../js/friends.js?v=13"></script>
<script src="../../js/mods.js?v=13"></script>
<script src="../../js/ai.js?v=13"></script>
<script src="../../js/admin.js?v=13"></script>
<script src="game.js"></script>
</body>
</html>
