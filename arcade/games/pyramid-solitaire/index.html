<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>Pyramid Solitaire — Claude Arc Games</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔺</text></svg>">
<link rel="stylesheet" href="../../css/main.css">
<!-- mobile-meta -->
<meta name="theme-color" content="#0f1220">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ArcGames">
<link rel="manifest" href="../../manifest.json">
<link rel="apple-touch-icon" href="../../icons/icon-192.png">
<!-- /mobile-meta -->
<script>window.ARCADE_ROOT_DEPTH = 2;</script>
<style>
  .pyr-row { display: flex; gap: 6px; justify-content: center; }
  .pyr-card {
    width: 40px; height: 56px; border-radius: 6px; border: 1px solid var(--border);
    background: var(--panel-2); display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: 0.85rem; cursor: default; opacity: 0.4;
  }
  .pyr-card.exposed { background: var(--panel); opacity: 1; cursor: pointer; border-color: var(--accent-2); }
  .pyr-card.exposed:hover { transform: translateY(-2px); }
  .pyr-card.selected { outline: 3px solid var(--accent-3); }
  .pyr-card.red { color: #ff5d5d; }
  .pyr-card.gone { visibility: hidden; }
  .pyr-stockwaste { display: flex; gap: 20px; justify-content: center; align-items: center; margin-top: 10px; }
  .pyr-pile {
    width: 44px; height: 60px; border-radius: 6px; border: 1px dashed var(--border);
    display: flex; align-items: center; justify-content: center; font-weight: 800; background: var(--panel-2);
  }
  .pyr-pile.filled { border-style: solid; background: var(--panel); cursor: pointer; }
</style>
</head>
<body>
<main class="game-shell">
  <div class="game-topbar">
    <a class="back-link" href="../../index.html">← <span data-i18n="back.toArcade">Back to Arcade</span></a>
    <h1>🔺 Pyramid Solitaire</h1>
    <div class="hud">
      <span class="stat"><span data-i18n="common.score">Score</span>: <b id="score">0</b></span>
      <span class="stat"><span data-i18n="common.best">Best</span>: <b id="best">0</b></span>
      <span class="stat">Stock: <b id="stock-count">24</b></span>
    </div>
  </div>
  <div class="game-stage">
    <div id="pyramid"></div>
    <div class="pyr-stockwaste">
      <div class="pyr-pile" id="stock-pile">🂠</div>
      <div class="pyr-pile" id="waste-pile"></div>
      <button class="btn" id="draw-btn">Draw</button>
    </div>
    <div id="result-banner"></div>
    <div class="controls-row">
      <button class="btn btn-primary" id="restart" data-i18n="common.newGame">New Game</button>
    </div>
  </div>
  <p class="instructions">Click two uncovered cards (from the pyramid or the waste pile) that add up to 13 to remove them (Ace=1 ... King=13, a King can be removed alone). Draw from the stock when you're stuck. Clear the whole pyramid to win.</p>
</main>

<script src="../../i18n/en.js"></script>
<script src="../../i18n/es.js"></script>
<script src="../../i18n/ru.js"></script>
<script src="../../i18n/ro.js"></script>
<script src="../../i18n/fr.js"></script>
<script src="../../i18n/de.js"></script>
<script src="../../js/i18n.js"></script>
<script src="../../js/common.js"></script>
<script src="../../js/friends.js"></script>
<script src="game.js"></script>
</body>
</html>
