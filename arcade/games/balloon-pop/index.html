<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>Balloon Pop — Claude Arc Games</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎈</text></svg>">
<link rel="stylesheet" href="../../css/main.css">
<!-- mobile-meta -->
<meta name="theme-color" content="#0f1220">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ArcGames">
<link rel="manifest" href="../../manifest.json">
<link rel="apple-touch-icon" href="../../icons/icon-192.png">
<!-- /mobile-meta -->
<script>window.ARCADE_ROOT_DEPTH = 2;</script>
<style>
  #board {
    position: relative; width: 100%; max-width: 480px; height: 480px;
    background:
      radial-gradient(circle at 20% 22%, rgba(124,92,255,0.20), transparent 42%),
      radial-gradient(circle at 82% 80%, rgba(41,224,201,0.16), transparent 44%),
      radial-gradient(circle at 60% 50%, rgba(255,93,162,0.10), transparent 55%),
      #0e1224;
    border: 1px solid var(--border); border-radius: 10px; overflow: hidden; touch-action: none;
  }
  .balloon { position: absolute; cursor: pointer; user-select: none; line-height: 1; transition: transform 0.05s ease; }
  .balloon:active { transform: scale(0.85); }
  .pop-particle { position: absolute; border-radius: 50%; pointer-events: none; }
</style>
</head>
<body>
<main class="game-shell">
  <div class="game-topbar">
    <a class="back-link" href="../../index.html">← <span data-i18n="back.toArcade">Back to Arcade</span></a>
    <h1>🎈 Balloon Pop</h1>
    <div class="hud">
      <span class="stat"><span data-i18n="common.score">Score</span>: <b id="score">0</b></span>
      <span class="stat"><span data-i18n="common.best">Best</span>: <b id="best">-</b></span>
      <span class="stat"><span data-i18n="common.time">Time</span>: <b id="time">30</b></span>
      <span class="stat"><span data-i18n="common.lives">Lives</span>: <b id="lives">3</b></span>
    </div>
  </div>
  <div class="game-stage">
    <div class="difficulty-row" id="difficulty"></div>
    <div id="board"></div>
    <div id="result-banner"></div>
    <div class="controls-row">
      <button class="btn btn-primary" id="restart" data-i18n="common.newGame">New Game</button>
    </div>
  </div>
  <p class="instructions">Click balloons to pop them for points before they float away. Watch out for the black bomb balloon — popping it costs you a life! Survive the clock with your 3 lives.</p>
</main>

<script src="../../i18n/en.js"></script>
<script src="../../i18n/es.js"></script>
<script src="../../i18n/ru.js"></script>
<script src="../../i18n/ro.js"></script>
<script src="../../i18n/fr.js"></script>
<script src="../../i18n/de.js"></script>
<script src="../../js/i18n.js"></script>
<script src="../../js/common.js"></script>
<script src="../../js/friends.js"></script>
<script src="../../js/admin.js"></script>
<script src="game.js"></script>
</body>
</html>
