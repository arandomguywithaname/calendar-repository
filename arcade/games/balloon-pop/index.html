<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Balloon Pop — Claude Arc Games</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎈</text></svg>">
<link rel="stylesheet" href="../../css/main.css">
<script>window.ARCADE_ROOT_DEPTH = 2;</script>
<style>
  #board { position: relative; width: 100%; max-width: 480px; height: 480px; background: var(--bg-alt); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; touch-action: none; }
  .balloon { position: absolute; cursor: pointer; user-select: none; line-height: 1; transition: transform 0.05s ease; }
  .balloon:active { transform: scale(0.85); }
</style>
</head>
<body>
<main class="game-shell">
  <div class="game-topbar">
    <a class="back-link" href="../../index.html">← <span data-i18n="back.toArcade">Back to Arcade</span></a>
    <h1>🎈 Balloon Pop</h1>
    <div class="hud">
      <span class="stat"><span data-i18n="common.score">Score</span>: <b id="score">0</b></span>
      <span class="stat"><span data-i18n="common.best">Best</span>: <b id="best">-</b></span>
      <span class="stat"><span data-i18n="common.time">Time</span>: <b id="time">30</b></span>
      <span class="stat"><span data-i18n="common.lives">Lives</span>: <b id="lives">3</b></span>
    </div>
  </div>
  <div class="game-stage">
    <div id="board"></div>
    <div id="result-banner"></div>
    <div class="controls-row">
      <button class="btn btn-primary" id="restart" data-i18n="common.newGame">New Game</button>
    </div>
  </div>
  <p class="instructions">Click balloons to pop them for points before they float away. Watch out for the black bomb balloon — popping it costs you a life! Survive the clock with your 3 lives.</p>
</main>

<script src="../../i18n/en.js"></script>
<script src="../../i18n/es.js"></script>
<script src="../../i18n/ru.js"></script>
<script src="../../i18n/ro.js"></script>
<script src="../../i18n/fr.js"></script>
<script src="../../i18n/de.js"></script>
<script src="../../js/i18n.js"></script>
<script src="../../js/common.js"></script>
<script src="../../js/friends.js"></script>
<script src="game.js"></script>
</body>
</html>
