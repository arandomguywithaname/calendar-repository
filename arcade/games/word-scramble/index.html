<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>Word Scramble — Claude Arc Games</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔀</text></svg>">
<link rel="stylesheet" href="../../css/main.css">
<!-- mobile-meta -->
<meta name="theme-color" content="#0f1220">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ArcGames">
<link rel="manifest" href="../../manifest.json">
<link rel="apple-touch-icon" href="../../icons/icon-192.png">
<!-- /mobile-meta -->
<script>window.ARCADE_ROOT_DEPTH = 2;</script>
<style>
  #answer-slots { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; min-height: 56px; }
  #answer-slots .slot {
    width: 44px; height: 52px; border: 2px dashed var(--border); border-radius: 8px;
    display: flex; align-items: center; justify-content: center; font-size: 1.4rem; font-weight: 800;
    background: var(--panel-2);
  }
  #answer-slots .slot.filled { border-style: solid; border-color: var(--accent-2); cursor: pointer; }
  #tile-tray { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
  #tile-tray .tile {
    width: 44px; height: 52px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--panel-2); display: flex; align-items: center; justify-content: center;
    font-size: 1.4rem; font-weight: 800; cursor: pointer; user-select: none;
    transition: transform 0.1s ease, opacity 0.1s ease;
  }
  #tile-tray .tile:hover { background: var(--panel); transform: translateY(-2px); }
  #tile-tray .tile.used { opacity: 0.25; cursor: default; pointer-events: none; }
  #hint { color: var(--text-dim); font-size: 0.85rem; min-height: 1.2em; }
</style>
</head>
<body>
<main class="game-shell">
  <div class="game-topbar">
    <a class="back-link" href="../../index.html">← <span data-i18n="back.toArcade">Back to Arcade</span></a>
    <h1>🔀 Word Scramble</h1>
    <div class="hud">
      <span class="stat"><span data-i18n="common.score">Score</span>: <b id="score">0</b></span>
      <span class="stat"><span data-i18n="common.best">Best</span>: <b id="best">0</b></span>
      <span class="stat">Round: <b id="round">1</b>/<b id="total-rounds">10</b></span>
    </div>
  </div>
  <div class="game-stage">
    <div id="hint"></div>
    <div id="answer-slots"></div>
    <div id="tile-tray"></div>
    <div id="result-banner"></div>
    <div class="controls-row">
      <button class="btn" id="undo-btn">Undo</button>
      <button class="btn" id="clear-btn">Clear</button>
      <button class="btn btn-primary" id="check-btn">Check</button>
      <button class="btn" id="skip-btn">Skip</button>
      <button class="btn" id="restart" data-i18n="common.newGame">New Game</button>
    </div>
  </div>
  <p class="instructions">Tap the scrambled letter tiles in order to spell the hidden word. Use Undo/Clear to fix mistakes, then press Check. 10 rounds per game.</p>
</main>

<script src="../../i18n/en.js"></script>
<script src="../../i18n/es.js"></script>
<script src="../../i18n/ru.js"></script>
<script src="../../i18n/ro.js"></script>
<script src="../../i18n/fr.js"></script>
<script src="../../i18n/de.js"></script>
<script src="../../js/i18n.js"></script>
<script src="../../js/common.js"></script>
<script src="../../js/friends.js"></script>
<script src="../../js/admin.js"></script>
<script src="game.js"></script>
</body>
</html>
