<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>Hangman — Claude Arc Games</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎪</text></svg>">
<link rel="stylesheet" href="../../css/main.css">
<!-- mobile-meta -->
<meta name="theme-color" content="#0f1220">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ArcGames">
<link rel="manifest" href="../../manifest.json">
<link rel="apple-touch-icon" href="../../icons/icon-192.png">
<!-- /mobile-meta -->
<script>window.ARCADE_ROOT_DEPTH = 2;</script>
<style>
  #word { font-size: 2rem; letter-spacing: 0.4em; font-weight: 800; }
  #keyboard { display: grid; grid-template-columns: repeat(9, 1fr); gap: 6px; max-width: 480px; }
  #keyboard button { padding: 8px 0; font-weight: 700; }
  #keyboard button:disabled { opacity: 0.3; }
</style>
</head>
<body>
<main class="game-shell">
  <div class="game-topbar">
    <a class="back-link" href="../../index.html">← <span data-i18n="back.toArcade">Back to Arcade</span></a>
    <h1>🎪 Hangman</h1>
    <div class="hud">
      <span class="stat"><span data-i18n="common.lives">Lives</span>: <b id="lives">6</b></span>
      <span class="stat"><span data-i18n="common.score">Score</span>: <b id="score">0</b></span>
    </div>
  </div>
  <div class="game-stage">
    <div id="figure" style="font-size:2.4rem;">🙂</div>
    <div id="word">_ _ _ _</div>
    <div id="result-banner"></div>
    <div id="keyboard"></div>
    <div class="controls-row">
      <button class="btn btn-primary" id="restart" data-i18n="common.newGame">New Game</button>
    </div>
  </div>
  <p class="instructions">Guess the hidden word one letter at a time before you run out of lives.</p>
</main>

<script src="../../i18n/en.js"></script>
<script src="../../i18n/es.js"></script>
<script src="../../i18n/ru.js"></script>
<script src="../../i18n/ro.js"></script>
<script src="../../i18n/fr.js"></script>
<script src="../../i18n/de.js"></script>
<script src="../../js/i18n.js"></script>
<script src="../../js/common.js"></script>
<script src="../../js/friends.js"></script>
<script src="game.js"></script>
</body>
</html>
