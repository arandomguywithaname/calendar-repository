<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2048 — Claude Arc Games</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔢</text></svg>">
<link rel="stylesheet" href="../../css/main.css">
<script>window.ARCADE_ROOT_DEPTH = 2;</script>
<style>
  #board { grid-template-columns: repeat(4, 80px); background: var(--bg-alt); padding: 8px; border-radius: 12px; }
  .cell { font-size: 1.6rem; }
</style>
</head>
<body>
<main class="game-shell">
  <div class="game-topbar">
    <a class="back-link" href="../../index.html">← <span data-i18n="back.toArcade">Back to Arcade</span></a>
    <h1>🔢 2048</h1>
    <div class="hud">
      <span class="stat"><span data-i18n="common.score">Score</span>: <b id="score">0</b></span>
      <span class="stat"><span data-i18n="common.best">Best</span>: <b id="best">0</b></span>
    </div>
  </div>
  <div class="game-stage">
    <div class="grid-board" id="board"></div>
    <div id="result-banner"></div>
    <div class="controls-row">
      <button class="btn btn-primary" id="restart" data-i18n="common.newGame">New Game</button>
    </div>
    <div class="controls-row" id="touch-controls">
      <button class="btn" data-dir="up">↑</button>
      <button class="btn" data-dir="left">←</button>
      <button class="btn" data-dir="down">↓</button>
      <button class="btn" data-dir="right">→</button>
    </div>
  </div>
  <p class="instructions">Use arrow keys, swipe, or the buttons to slide tiles. Matching tiles merge — reach 2048!</p>
</main>

<script src="../../i18n/en.js"></script>
<script src="../../i18n/es.js"></script>
<script src="../../i18n/ru.js"></script>
<script src="../../i18n/ro.js"></script>
<script src="../../i18n/fr.js"></script>
<script src="../../i18n/de.js"></script>
<script src="../../js/i18n.js"></script>
<script src="../../js/common.js"></script>
<script src="../../js/friends.js"></script>
<script src="game.js"></script>
</body>
</html>
