<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>Color Match — Claude Arc Games</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌈</text></svg>">
<link rel="stylesheet" href="../../css/main.css?v=15">
<!-- mobile-meta -->
<meta name="theme-color" content="#0f1220">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ArcGames">
<link rel="manifest" href="../../manifest.json">
<link rel="apple-touch-icon" href="../../icons/icon-192.png">
<!-- /mobile-meta -->
<script>window.ARCADE_ROOT_DEPTH = 2;</script>
<style>
  #word-display { transition: text-shadow 0.15s ease; }
  .swatch { transition: transform 0.1s ease, box-shadow 0.15s ease; }
  .swatch:hover { transform: translateY(-2px); }
  .flash-good { animation: flashGood 0.4s ease; }
  .flash-bad { animation: flashBad 0.4s ease; }
  @keyframes flashGood {
    0% { box-shadow: 0 0 0 rgba(61,220,132,0); }
    40% { box-shadow: 0 0 42px 10px rgba(61,220,132,0.9); }
    100% { box-shadow: 0 0 0 rgba(61,220,132,0); }
  }
  @keyframes flashBad {
    0% { box-shadow: 0 0 0 rgba(255,93,93,0); }
    40% { box-shadow: 0 0 42px 10px rgba(255,93,93,0.9); }
    100% { box-shadow: 0 0 0 rgba(255,93,93,0); }
  }
</style>
</head>
<body>
<main class="game-shell">
  <div class="game-topbar">
    <a class="back-link" href="../../index.html">← <span data-i18n="back.toArcade">Back to Arcade</span></a>
    <h1>🌈 Color Match</h1>
    <div class="hud">
      <span class="stat"><span data-i18n="common.score">Score</span>: <b id="score">0</b></span>
      <span class="stat"><span data-i18n="common.best">Best</span>: <b id="best">0</b></span>
      <span class="stat"><span data-i18n="common.time">Time</span>: <b id="time">45</b>s</span>
    </div>
  </div>
  <div class="game-stage">
    <div class="difficulty-row" id="difficulty"></div>
    <div id="round-info" style="color:var(--text-dim); font-size:0.85rem;">Round 0 / 20 · avg reaction: -</div>
    <div id="word-display" style="font-size:3rem; font-weight:800; min-height:4rem;">Ready?</div>
    <div id="swatch-row" style="display:flex; gap:14px; flex-wrap:wrap; justify-content:center;"></div>
    <div id="result-banner"></div>
    <div class="controls-row">
      <button class="btn btn-primary" id="restart" data-i18n="common.newGame">New Game</button>
    </div>
  </div>
  <p class="instructions">Click the swatch matching the TEXT COLOR the word is drawn in — not the word's meaning. Answer fast across 20 rounds or 45 seconds.</p>
</main>

<script src="../../i18n/en.js?v=15"></script>
<script src="../../i18n/es.js?v=15"></script>
<script src="../../i18n/ru.js?v=15"></script>
<script src="../../i18n/ro.js?v=15"></script>
<script src="../../i18n/fr.js?v=15"></script>
<script src="../../i18n/de.js?v=15"></script>
<script src="../../js/i18n.js?v=15"></script>
<script src="../../js/common.js?v=15"></script>
<script src="../../js/friends.js?v=15"></script>
<script src="../../js/mods.js?v=15"></script>
<script src="../../js/ai.js?v=15"></script>
<script src="../../js/admin.js?v=15"></script>
<script src="game.js"></script>
</body>
</html>
