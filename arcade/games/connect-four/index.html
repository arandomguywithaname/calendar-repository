<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Connect Four — Claude Arc Games</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔵</text></svg>">
<link rel="stylesheet" href="../../css/main.css">
<script>window.ARCADE_ROOT_DEPTH = 2;</script>
<style>
  #board { grid-template-columns: repeat(7, 52px); grid-template-rows: repeat(6, 52px); background: #1b3a8c; padding: 8px; border-radius: 12px; box-shadow: 0 0 24px rgba(124,92,255,0.25); position: relative; }
  #board .cell { background: var(--bg-alt); border-radius: 50%; font-size: 1.6rem; }
  #board .cell.disc-red { background: radial-gradient(circle at 35% 30%, #ffb0b0, #ff5d5d 55%, #b02626); box-shadow: 0 0 12px rgba(255,93,93,0.75), inset 0 2px 5px rgba(255,255,255,0.45); }
  #board .cell.disc-yellow { background: radial-gradient(circle at 35% 30%, #fff2ab, #ffd23f 55%, #d19a00); box-shadow: 0 0 12px rgba(255,210,63,0.75), inset 0 2px 5px rgba(255,255,255,0.45); }
  #board .cell.win { animation: c4pulse 0.7s ease-in-out infinite; }
  @keyframes c4pulse { 0%,100% { transform: scale(1); box-shadow: 0 0 12px rgba(255,255,255,0.6); } 50% { transform: scale(1.1); box-shadow: 0 0 26px #ffffff; } }
  .c4-particle { position: absolute; width: 8px; height: 8px; border-radius: 50%; pointer-events: none; }
  #columns { grid-template-columns: repeat(7, 52px); display: grid; gap: 8px; margin-bottom: -4px; }
  #columns button { width: 52px; height: 30px; padding: 0; }
</style>
</head>
<body>
<main class="game-shell">
  <div class="game-topbar">
    <a class="back-link" href="../../index.html">← <span data-i18n="back.toArcade">Back to Arcade</span></a>
    <h1>🔵 Connect Four</h1>
    <div class="hud">
      <span class="stat" id="turn-stat"><span data-i18n="common.yourTurn">Your turn</span></span>
      <span class="stat"><span data-i18n="common.score">Score</span>: <b id="score">0</b></span>
      <span class="stat"><span data-i18n="common.best">Best</span>: <b id="best">-</b></span>
    </div>
  </div>
  <div class="game-stage">
    <div class="difficulty-row" id="difficulty"></div>
    <div id="columns"></div>
    <div class="grid-board" id="board"></div>
    <div id="result-banner"></div>
    <div class="controls-row">
      <button class="btn btn-primary" id="restart" data-i18n="common.newGame">New Game</button>
    </div>
  </div>
  <p class="instructions">Click a column to drop your red disc. Connect four in a row, column, or diagonal before the yellow CPU does.</p>
</main>

<script src="../../i18n/en.js"></script>
<script src="../../i18n/es.js"></script>
<script src="../../i18n/ru.js"></script>
<script src="../../i18n/ro.js"></script>
<script src="../../i18n/fr.js"></script>
<script src="../../i18n/de.js"></script>
<script src="../../js/i18n.js"></script>
<script src="../../js/common.js"></script>
<script src="../../js/friends.js"></script>
<script src="game.js"></script>
</body>
</html>
