<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>Plinko — Claude Arc Games</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔴</text></svg>">
<link rel="stylesheet" href="../../css/main.css?v=16">
<!-- mobile-meta -->
<meta name="theme-color" content="#0f1220">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ArcGames">
<link rel="manifest" href="../../manifest.json">
<link rel="apple-touch-icon" href="../../icons/icon-192.png">
<!-- /mobile-meta -->
<script>window.ARCADE_ROOT_DEPTH = 2;</script>
</head>
<body>
<main class="game-shell">
  <div class="game-topbar">
    <a class="back-link" href="../../index.html">← <span data-i18n="back.toArcade">Back to Arcade</span></a>
    <h1>🔴 Plinko</h1>
    <div class="hud">
      <span class="stat"><span data-i18n="common.score">Score</span>: <b id="score">0</b></span>
      <span class="stat"><span data-i18n="common.best">Best</span>: <b id="best">0</b></span>
    </div>
  </div>

  <div class="game-stage">
    <canvas id="board" width="560" height="520"></canvas>
    <div class="controls-row">
      <button class="btn btn-primary" id="drop">Drop Ball</button>
      <button class="btn" id="drop5">Drop 5</button>
      <button class="btn" id="reset" data-i18n="common.newGame">New Game</button>
    </div>
  </div>
  <p class="instructions">Drop a ball and watch it bounce through the pegs. Land in a high-value slot to score. Click anywhere on the board to drop from that spot.</p>
</main>

<script src="../../i18n/en.js?v=16"></script>
<script src="../../i18n/es.js?v=16"></script>
<script src="../../i18n/ru.js?v=16"></script>

<script src="../../js/common.js?v=16"></script>
<script src="../../js/friends.js?v=16"></script>
<script src="../../js/mods.js?v=16"></script>
<script src="../../js/ai.js?v=16"></script>
<script src="../../js/admin.js?v=16"></script>
<script src="game.js"></script>
</body>
</html>
