<head>

<title>Whack-a-Mole — Claude Arc Games</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔨</text></svg>">
<link rel="stylesheet" href="../../css/main.css?v=11">
<!-- mobile-meta -->
<meta name="theme-color" content="#0f1220">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ArcGames">
<link rel="manifest" href="../../manifest.json">
<link rel="apple-touch-icon" href="../../icons/icon-192.png">
<!-- /mobile-meta -->
<script>window.ARCADE_ROOT_DEPTH = 2;</script>
<style>
  /* Cell shrinks to fit narrow phones instead of pushing the page wide. */
  #board { --cell: min(96px, calc((100vw - 100px) / 3)); }
  #board {
    position: relative;
    display: grid;
    grid-template-columns: repeat(3, var(--cell));
    gap: 12px;
    padding: 18px;
    border-radius: 18px;
    background: radial-gradient(120% 120% at 50% 0%, #1b2140, #0c0f1f);
    border: 1px solid rgba(124, 92, 255, 0.4);
    box-shadow: 0 0 34px rgba(124, 92, 255, 0.35), inset 0 0 30px rgba(0, 0, 0, 0.6);
  }
  #board .hole {
    width: var(--cell); height: var(--cell);
    display: flex; align-items: center; justify-content: center;
    font-size: min(2.6rem, calc(var(--cell) * 0.42));
    border-radius: 50%;
    cursor: pointer;
    user-select: none;
    background: radial-gradient(circle at 50% 62%, #05060d 0%, #0a0d1a 55%, #12162a 100%);
    border: 2px solid rgba(41, 224, 201, 0.35);
    box-shadow: inset 0 6px 16px rgba(0, 0, 0, 0.85), 0 0 14px rgba(41, 224, 201, 0.28);
    transition: box-shadow 0.15s ease, border-color 0.15s ease, transform 0.08s ease;
  }
  #board .hole:hover { border-color: rgba(41, 224, 201, 0.7); }
  #board .hole.up {
    background: radial-gradient(circle at 50% 42%, #ff9dc7 0%, #ff5da2 48%, #7c5cff 100%);
    border-color: #ffd23f;
    box-shadow: 0 0 26px rgba(255, 93, 162, 0.85), inset 0 0 18px rgba(255, 255, 255, 0.35);
    text-shadow: 0 0 12px rgba(255, 255, 255, 0.9);
    animation: molePop 0.18s ease-out;
  }
  #board .hole.whacked {
    background: radial-gradient(circle at 50% 50%, #ffe680 0%, #ffb700 55%, #ff5da2 100%);
    border-color: #ffd23f;
    box-shadow: 0 0 30px rgba(255, 210, 63, 0.9);
    transform: scale(0.92);
  }
  @keyframes molePop {
    0% { transform: scale(0.4); }
    100% { transform: scale(1); }
  }
  .particle-layer { position: absolute; inset: 0; pointer-events: none; overflow: visible; }
  .particle {
    position: absolute;
    width: 9px; height: 9px;
    border-radius: 50%;
    background: currentColor;
    box-shadow: 0 0 10px currentColor;
    transform: translate(-50%, -50%);
    animation: whackBurst 0.6s ease-out forwards;
  }
  @keyframes whackBurst {
    to { transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(0.2); opacity: 0; }
  }
</style>
</head>
<body>
<main class="game-shell">
  <div class="game-topbar">
    <a class="back-link" href="../../index.html">← <span data-i18n="back.toArcade">Back to Arcade</span></a>
    <h1>🔨 Whack-a-Mole</h1>
    <div class="hud">
      <span class="stat"><span data-i18n="common.score">Score</span>: <b id="score">0</b></span>
      <span class="stat"><span data-i18n="common.time">Time</span>: <b id="time">30</b></span>
      <span class="stat"><span data-i18n="common.best">Best</span>: <b id="best">0</b></span>
    </div>
  </div>
  <div class="game-stage">
    <div class="difficulty-row" id="difficulty"></div>
    <div id="board"></div>
    <div id="result-banner"></div>
    <div class="controls-row">
      <button class="btn btn-primary" id="restart" data-i18n="common.newGame">New Game</button>
    </div>
  </div>
  <p class="instructions">Click the glowing moles as they pop up before they disappear. You have 30 seconds. <b>Easy</b> moles linger and appear one at a time, <b>Medium</b> is classic, <b>Hard</b> is fast with up to three moles at once.</p>
</main>
