<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>Sudoku — Claude Arc Games</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔣</text></svg>">
<link rel="stylesheet" href="../../css/main.css">
<!-- mobile-meta -->
<meta name="theme-color" content="#0f1220">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ArcGames">
<link rel="manifest" href="../../manifest.json">
<link rel="apple-touch-icon" href="../../icons/icon-192.png">
<!-- /mobile-meta -->
<script>window.ARCADE_ROOT_DEPTH = 2;</script>
<style>
  #board { --sq: min(38px, calc((100vw - 56px) / 9)); grid-template-columns: repeat(9, var(--sq)); grid-template-rows: repeat(9, var(--sq)); gap: 2px; background: var(--border); padding: 2px; border-radius: 8px; }
  #board .cell { font-size: 1.1rem; border-radius: 0; background: var(--panel-2); }
  #board .cell.given { color: var(--text); font-weight: 800; background: var(--panel); cursor: default; }
  #board .cell.selected { background: var(--accent-2); color: white; box-shadow: 0 0 12px var(--accent-2), inset 0 0 6px rgba(255,255,255,0.3); }
  #board .cell.conflict { background: var(--danger); color: white; box-shadow: 0 0 10px var(--danger); }
  #board .cell.b-right { border-right: 2px solid var(--accent-3); }
  #board .cell.b-bottom { border-bottom: 2px solid var(--accent-3); }
  #numpad { --sq: min(38px, calc((100vw - 56px) / 9)); display: grid; grid-template-columns: repeat(9, var(--sq)); gap: 4px; }
  #numpad button { width: var(--sq); height: var(--sq); padding: 0; font-weight: 700; }
</style>
</head>
<body>
<main class="game-shell">
  <div class="game-topbar">
    <a class="back-link" href="../../index.html">← <span data-i18n="back.toArcade">Back to Arcade</span></a>
    <h1>🔣 Sudoku</h1>
    <div class="hud">
      <span class="stat"><span data-i18n="common.time">Time</span>: <b id="time">0</b></span>
      <span class="stat"><span data-i18n="common.best">Best</span>: <b id="best">-</b></span>
    </div>
  </div>
  <div class="game-stage">
    <div class="difficulty-row" id="difficulty"></div>
    <div class="grid-board" id="board"></div>
    <div id="numpad"></div>
    <div id="result-banner"></div>
    <div class="controls-row">
      <button class="btn" id="clear-cell">Clear Cell</button>
      <button class="btn btn-primary" id="restart" data-i18n="common.newGame">New Game</button>
    </div>
  </div>
  <p class="instructions">Click a cell, then click a number (or type 1-9) to fill it. Conflicting numbers are highlighted in red. Fill the whole grid correctly to win.</p>
</main>

<script src="../../i18n/en.js"></script>
<script src="../../i18n/es.js"></script>
<script src="../../i18n/ru.js"></script>
<script src="../../i18n/ro.js"></script>
<script src="../../i18n/fr.js"></script>
<script src="../../i18n/de.js"></script>
<script src="../../js/i18n.js"></script>
<script src="../../js/common.js"></script>
<script src="../../js/friends.js"></script>
<script src="../../js/admin.js"></script>
<script src="game.js"></script>
</body>
</html>
