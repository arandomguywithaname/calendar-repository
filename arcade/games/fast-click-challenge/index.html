<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>Fast Click Challenge — Claude Arc Games</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🖱️</text></svg>">
<link rel="stylesheet" href="../../css/main.css?v=16">
<!-- mobile-meta -->
<meta name="theme-color" content="#0f1220">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ArcGames">
<link rel="manifest" href="../../manifest.json">
<link rel="apple-touch-icon" href="../../icons/icon-192.png">
<!-- /mobile-meta -->
<script>window.ARCADE_ROOT_DEPTH = 2;</script>
</head>
<body>
<main class="game-shell">
  <div class="game-topbar">
    <a class="back-link" href="../../index.html">← <span data-i18n="back.toArcade">Back to Arcade</span></a>
    <h1>🖱️ Fast Click Challenge</h1>
    <div class="hud">
      <span class="stat"><span data-i18n="common.score">Score</span>: <b id="score">0</b></span>
      <span class="stat"><span data-i18n="common.best">Best</span>: <b id="best">0</b></span>
      <span class="stat"><span data-i18n="common.time">Time</span>: <b id="time">10.0</b>s</span>
    </div>
  </div>
  <div class="game-stage">
    <button class="btn btn-primary" id="big-button" style="width:220px;height:220px;border-radius:50%;font-size:1.4rem;font-weight:800;">Click to Start!</button>
    <div id="result-banner"></div>
    <div class="controls-row">
      <button class="btn" id="restart" data-i18n="common.newGame">New Game</button>
    </div>
  </div>
  <p class="instructions">Click the button as many times as you can before the 10 second timer runs out.</p>
</main>

<script src="../../i18n/en.js?v=16"></script>
<script src="../../i18n/es.js?v=16"></script>

<script src="../../i18n/fr.js?v=16"></script>
<script src="../../i18n/de.js?v=16"></script>
<script src="../../js/i18n.js?v=16"></script>
<script src="../../js/common.js?v=16"></script>
<script src="../../js/friends.js?v=16"></script>
<script src="../../js/mods.js?v=16"></script>
<script src="../../js/ai.js?v=16"></script>
<script src="../../js/admin.js?v=16"></script>
<script src="game.js"></script>
</body>
</html>
