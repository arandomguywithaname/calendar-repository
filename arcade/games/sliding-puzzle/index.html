<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>Sliding Puzzle — Claude Arc Games</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧩</text></svg>">
<link rel="stylesheet" href="../../css/main.css?v=14">
<!-- mobile-meta -->
<meta name="theme-color" content="#0f1220">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ArcGames">
<link rel="manifest" href="../../manifest.json">
<link rel="apple-touch-icon" href="../../icons/icon-192.png">
<!-- /mobile-meta -->
<script>window.ARCADE_ROOT_DEPTH = 2;</script>
<style>
  #board { grid-template-columns: repeat(4, 70px); grid-template-rows: repeat(4, 70px); }
  #board .cell { font-size: 1.5rem; }
  #board .cell:not(.blank) { background: linear-gradient(135deg, #2d3566, #3a4176); color: var(--accent-3); font-weight: 800; box-shadow: 0 0 9px rgba(124,92,255,0.4); }
  #board .cell.blank { background: transparent; border-color: transparent; cursor: default; box-shadow: none; }
  #board.solved .cell:not(.blank) { animation: spflash 0.7s ease; }
  @keyframes spflash { 0% { box-shadow: 0 0 9px var(--accent-3); } 50% { box-shadow: 0 0 28px var(--good); transform: scale(1.07); } 100% { box-shadow: 0 0 12px var(--good); } }
</style>
</head>
<body>
<main class="game-shell">
  <div class="game-topbar">
    <a class="back-link" href="../../index.html">← <span data-i18n="back.toArcade">Back to Arcade</span></a>
    <h1>🧩 Sliding Puzzle</h1>
    <div class="hud">
      <span class="stat"><span data-i18n="common.moves">Moves</span>: <b id="moves">0</b></span>
      <span class="stat"><span data-i18n="common.best">Best</span>: <b id="best">-</b></span>
    </div>
  </div>
  <div class="game-stage">
    <div class="difficulty-row" id="difficulty"></div>
    <div class="grid-board" id="board"></div>
    <div id="result-banner"></div>
    <div class="controls-row">
      <button class="btn btn-primary" id="restart" data-i18n="common.newGame">New Game</button>
    </div>
  </div>
  <p class="instructions">Click a tile next to the empty space to slide it. Arrange the tiles 1-15 in order to win.</p>
</main>

<script src="../../i18n/en.js?v=14"></script>
<script src="../../i18n/es.js?v=14"></script>
<script src="../../i18n/ru.js?v=14"></script>
<script src="../../i18n/ro.js?v=14"></script>
<script src="../../i18n/fr.js?v=14"></script>
<script src="../../i18n/de.js?v=14"></script>
<script src="../../js/i18n.js?v=14"></script>
<script src="../../js/common.js?v=14"></script>
<script src="../../js/friends.js?v=14"></script>
<script src="../../js/mods.js?v=14"></script>
<script src="../../js/ai.js?v=14"></script>
<script src="../../js/admin.js?v=14"></script>
<script src="game.js"></script>
</body>
</html>
