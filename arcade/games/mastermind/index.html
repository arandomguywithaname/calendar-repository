<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>Mastermind — Claude Arc Games</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧠</text></svg>">
<link rel="stylesheet" href="../../css/main.css?v=18">
<!-- mobile-meta -->
<meta name="theme-color" content="#0f1220">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ArcGames">
<link rel="manifest" href="../../manifest.json">
<link rel="apple-touch-icon" href="../../icons/icon-192.png">
<!-- /mobile-meta -->
<script>window.ARCADE_ROOT_DEPTH = 2;</script>
<style>
  #history { display: flex; flex-direction: column-reverse; gap: 6px; width: 100%; max-width: 420px; max-height: 300px; overflow-y: auto; }
  .guess-row { display: flex; align-items: center; gap: 10px; background: var(--panel-2); border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; }
  .guess-slots { display: flex; gap: 6px; }
  .peg-slot { width: 30px; height: 30px; border-radius: 50%; background: var(--bg-alt); border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; font-size: 1rem; }
  .feedback-pegs { display: grid; grid-template-columns: repeat(2, 9px); gap: 3px; margin-left: auto; }
  .feedback-peg { width: 9px; height: 9px; border-radius: 50%; }
  .feedback-peg.black { background: #111; }
  .feedback-peg.white { background: #eee; border: 1px solid #999; }
  .feedback-peg.none { background: transparent; }
  #current-guess { display: flex; gap: 8px; }
  #palette { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
  .color-btn { width: 40px; height: 40px; border-radius: 50%; border: 2px solid var(--border); cursor: pointer; font-size: 1.2rem; display: flex; align-items: center; justify-content: center; }
</style>
</head>
<body>
<main class="game-shell">
  <div class="game-topbar">
    <a class="back-link" href="../../index.html">← <span data-i18n="back.toArcade">Back to Arcade</span></a>
    <h1>🧠 Mastermind</h1>
    <div class="hud">
      <span class="stat">Guesses left: <b id="guesses-left">10</b></span>
      <span class="stat"><span data-i18n="common.best">Best</span>: <b id="best">-</b></span>
    </div>
  </div>
  <div class="game-stage">
    <div id="history"></div>
    <div id="current-guess"></div>
    <div id="palette"></div>
    <div id="result-banner"></div>
    <div class="controls-row">
      <button class="btn" id="clear-guess">Clear</button>
      <button class="btn btn-primary" id="submit-guess">Submit Guess</button>
    </div>
    <div class="controls-row">
      <button class="btn btn-primary" id="restart" data-i18n="common.newGame">New Game</button>
    </div>
  </div>
  <p class="instructions">Pick 4 colors to guess the secret code (colors may repeat). After each guess: a black peg means right color in the right spot, a white peg means right color, wrong spot. You have 10 guesses.</p>
</main>

<script src="../../i18n/en.js?v=18"></script>
<script src="../../i18n/es.js?v=18"></script>
<script src="../../i18n/ru.js?v=18"></script>
<script src="../../i18n/ro.js?v=18"></script>
<script src="../../i18n/fr.js?v=18"></script>
<script src="../../i18n/de.js?v=18"></script>
<script src="../../js/i18n.js?v=18"></script>
<script src="../../js/common.js?v=18"></script>
<script src="../../js/friends.js?v=18"></script>
<script src="../../js/mods.js?v=18"></script>
<script src="../../js/ai.js?v=18"></script>
<script src="../../js/admin.js?v=18"></script>
<script src="game.js"></script>
</body>
</html>
