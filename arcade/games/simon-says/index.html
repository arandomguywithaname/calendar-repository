<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>Simon Says — Claude Arc Games</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎵</text></svg>">
<link rel="stylesheet" href="../../css/main.css?v=14">
<!-- mobile-meta -->
<meta name="theme-color" content="#0f1220">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ArcGames">
<link rel="manifest" href="../../manifest.json">
<link rel="apple-touch-icon" href="../../icons/icon-192.png">
<!-- /mobile-meta -->
<script>window.ARCADE_ROOT_DEPTH = 2;</script>
<style>
  #board {
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: 1fr 1fr;
    gap: 8px;
    width: min(320px, 80vw);
    height: min(320px, 80vw);
  }
  .simon-quad {
    border-radius: 14px;
    border: none;
    cursor: pointer;
    opacity: 0.55;
    transition: opacity 0.1s ease, transform 0.1s ease;
  }
  .simon-quad.lit { opacity: 1; transform: scale(0.97); }
  .simon-quad:disabled { cursor: default; }
  #board { position: relative; }
  #q0 { background: #ff5da2; border-top-left-radius: 999px; }
  #q1 { background: #29e0c9; border-top-right-radius: 999px; }
  #q2 { background: #ffb84d; border-bottom-left-radius: 999px; }
  #q3 { background: #7c5cff; border-bottom-right-radius: 999px; }
  #q0.lit { box-shadow: 0 0 26px 6px #ff5da2, 0 0 64px 14px rgba(255,93,162,0.55); }
  #q1.lit { box-shadow: 0 0 26px 6px #29e0c9, 0 0 64px 14px rgba(41,224,201,0.55); }
  #q2.lit { box-shadow: 0 0 26px 6px #ffb84d, 0 0 64px 14px rgba(255,184,77,0.55); }
  #q3.lit { box-shadow: 0 0 26px 6px #7c5cff, 0 0 64px 14px rgba(124,92,255,0.55); }
  .simon-particle {
    position: absolute; width: 9px; height: 9px; border-radius: 50%;
    pointer-events: none; z-index: 5;
    transition: transform 0.5s ease-out, opacity 0.5s ease-out;
  }
</style>
</head>
<body>
<main class="game-shell">
  <div class="game-topbar">
    <a class="back-link" href="../../index.html">← <span data-i18n="back.toArcade">Back to Arcade</span></a>
    <h1>🎵 Simon Says</h1>
    <div class="hud">
      <span class="stat"><span data-i18n="common.level">Level</span>: <b id="level">0</b></span>
      <span class="stat"><span data-i18n="common.best">Best</span>: <b id="best">0</b></span>
    </div>
  </div>
  <div class="game-stage">
    <div class="difficulty-row" id="difficulty"></div>
    <div id="board">
      <button class="simon-quad" id="q0" data-idx="0"></button>
      <button class="simon-quad" id="q1" data-idx="1"></button>
      <button class="simon-quad" id="q2" data-idx="2"></button>
      <button class="simon-quad" id="q3" data-idx="3"></button>
    </div>
    <div id="result-banner"></div>
    <div class="controls-row">
      <button class="btn btn-primary" id="restart" data-i18n="common.newGame">New Game</button>
    </div>
  </div>
  <p class="instructions">Watch the sequence light up, then click the quadrants in the same order. Each round adds one more step — how far can you go?</p>
</main>

<script src="../../i18n/en.js?v=14"></script>
<script src="../../i18n/es.js?v=14"></script>
<script src="../../i18n/ru.js?v=14"></script>
<script src="../../i18n/ro.js?v=14"></script>
<script src="../../i18n/fr.js?v=14"></script>
<script src="../../i18n/de.js?v=14"></script>
<script src="../../js/i18n.js?v=14"></script>
<script src="../../js/common.js?v=14"></script>
<script src="../../js/friends.js?v=14"></script>
<script src="../../js/mods.js?v=14"></script>
<script src="../../js/ai.js?v=14"></script>
<script src="../../js/admin.js?v=14"></script>
<script src="game.js"></script>
</body>
</html>
