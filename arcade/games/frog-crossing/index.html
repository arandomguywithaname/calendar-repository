<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>Frog Crossing — Claude Arc Games</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🐸</text></svg>">
<link rel="stylesheet" href="../../css/main.css">
<!-- mobile-meta -->
<meta name="theme-color" content="#0f1220">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ArcGames">
<link rel="manifest" href="../../manifest.json">
<link rel="apple-touch-icon" href="../../icons/icon-192.png">
<!-- /mobile-meta -->
<script>window.ARCADE_ROOT_DEPTH = 2;</script>
<style>
  #touch-controls { display: grid; grid-template-columns: repeat(3, 56px); grid-template-rows: repeat(2, 56px); gap: 6px; justify-content: center; }
  #touch-controls button { font-size: 1.2rem; }
</style>
</head>
<body>
<main class="game-shell">
  <div class="game-topbar">
    <a class="back-link" href="../../index.html">← <span data-i18n="back.toArcade">Back to Arcade</span></a>
    <h1>🐸 Frog Crossing</h1>
    <div class="hud">
      <span class="stat"><span data-i18n="common.score">Score</span>: <b id="score">0</b></span>
      <span class="stat"><span data-i18n="common.best">Best</span>: <b id="best">-</b></span>
      <span class="stat"><span data-i18n="common.level">Level</span>: <b id="level">1</b></span>
    </div>
  </div>
  <div class="game-stage">
    <div class="difficulty-row" id="difficulty"></div>
    <canvas id="board" width="450" height="500"></canvas>
    <div id="result-banner"></div>
    <div class="controls-row">
      <button class="btn btn-primary" id="restart" data-i18n="common.newGame">New Game</button>
    </div>
    <div id="touch-controls">
      <span></span>
      <button class="btn" data-dir="up">↑</button>
      <span></span>
      <button class="btn" data-dir="left">←</button>
      <button class="btn" data-dir="down">↓</button>
      <button class="btn" data-dir="right">→</button>
    </div>
  </div>
  <p class="instructions">Use arrow keys or the buttons to hop the frog across the road, dodging traffic. Reach the top to score and start a faster crossing. One hit ends the game.</p>
</main>

<script src="../../i18n/en.js"></script>
<script src="../../i18n/es.js"></script>
<script src="../../i18n/ru.js"></script>
<script src="../../i18n/ro.js"></script>
<script src="../../i18n/fr.js"></script>
<script src="../../i18n/de.js"></script>
<script src="../../js/i18n.js"></script>
<script src="../../js/common.js"></script>
<script src="../../js/friends.js"></script>
<script src="game.js"></script>
</body>
</html>
