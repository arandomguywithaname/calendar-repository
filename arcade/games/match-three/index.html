<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>Match Three — Claude Arc Games</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💎</text></svg>">
<link rel="stylesheet" href="../../css/main.css?v=13">
<!-- mobile-meta -->
<meta name="theme-color" content="#0f1220">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ArcGames">
<link rel="manifest" href="../../manifest.json">
<link rel="apple-touch-icon" href="../../icons/icon-192.png">
<!-- /mobile-meta -->
<script>window.ARCADE_ROOT_DEPTH = 2;</script>
<style>
  #board { grid-template-columns: repeat(8, 38px); grid-auto-rows: 38px; gap: 4px; }
  #board .cell { font-size: 1.3rem; padding: 0; }
  #board .cell.selected { outline: 3px solid var(--accent-3); outline-offset: -3px; }
</style>
</head>
<body>
<main class="game-shell">
  <div class="game-topbar">
    <a class="back-link" href="../../index.html">← <span data-i18n="back.toArcade">Back to Arcade</span></a>
    <h1>💎 Match Three</h1>
    <div class="hud">
      <span class="stat"><span data-i18n="common.score">Score</span>: <b id="score">0</b></span>
      <span class="stat">Target: <b id="target">300</b></span>
      <span class="stat">Moves left: <b id="moves-left">25</b></span>
      <span class="stat"><span data-i18n="common.best">Best</span>: <b id="best">0</b></span>
    </div>
  </div>
  <div class="game-stage">
    <div class="grid-board" id="board"></div>
    <div id="result-banner"></div>
    <div class="controls-row">
      <button class="btn btn-primary" id="restart" data-i18n="common.newGame">New Game</button>
    </div>
  </div>
  <p class="instructions">Click a gem, then click an adjacent gem to swap them. Line up 3 or more matching gems in a row or column to clear them and score points. Reach the target score before you run out of moves.</p>
</main>

<script src="../../i18n/en.js?v=13"></script>
<script src="../../i18n/es.js?v=13"></script>
<script src="../../i18n/ru.js?v=13"></script>
<script src="../../i18n/ro.js?v=13"></script>
<script src="../../i18n/fr.js?v=13"></script>
<script src="../../i18n/de.js?v=13"></script>
<script src="../../js/i18n.js?v=13"></script>
<script src="../../js/common.js?v=13"></script>
<script src="../../js/friends.js?v=13"></script>
<script src="../../js/mods.js?v=13"></script>
<script src="../../js/ai.js?v=13"></script>
<script src="../../js/admin.js?v=13"></script>
<script src="game.js"></script>
</body>
</html>
