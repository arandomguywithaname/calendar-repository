<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mini Crossword — Claude Arc Games</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📝</text></svg>">
<link rel="stylesheet" href="../../css/main.css">
<script>window.ARCADE_ROOT_DEPTH = 2;</script>
<style>
  #cw-board { grid-template-columns: repeat(5, 46px); grid-template-rows: repeat(5, 46px); gap: 2px; background: var(--border); padding: 2px; border-radius: 8px; }
  #cw-board .cell { position: relative; background: var(--panel-2); border-radius: 0; font-size: 1.2rem; text-transform: uppercase; }
  #cw-board .cell.block { background: transparent; cursor: default; }
  #cw-board .cell.active-word { background: var(--panel); }
  #cw-board .cell.selected { background: var(--accent-2); color: white; }
  #cw-board .cell .num { position: absolute; top: 1px; left: 3px; font-size: 0.55rem; font-weight: 700; color: var(--text-dim); }
  #cw-board .cell.selected .num { color: white; }
  #clues { display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; max-width: 500px; }
  #clues .clue-col { display: flex; flex-direction: column; gap: 4px; font-size: 0.85rem; text-align: left; min-width: 180px; }
  #clues .clue-col h3 { margin: 0 0 2px; font-size: 0.85rem; color: var(--text-dim); }
  #clues .clue-item { cursor: pointer; padding: 3px 6px; border-radius: 6px; }
  #clues .clue-item.active { background: var(--panel-2); font-weight: 700; }
</style>
</head>
<body>
<main class="game-shell">
  <div class="game-topbar">
    <a class="back-link" href="../../index.html">← <span data-i18n="back.toArcade">Back to Arcade</span></a>
    <h1>📝 Mini Crossword</h1>
    <div class="hud">
      <span class="stat"><span data-i18n="common.best">Best</span>: <b id="best">-</b></span>
    </div>
  </div>
  <div class="game-stage">
    <div class="grid-board" id="cw-board"></div>
    <div id="clues"></div>
    <div id="result-banner"></div>
    <div class="controls-row">
      <button class="btn" id="check-btn">Check</button>
      <button class="btn btn-primary" id="restart" data-i18n="common.newGame">New Game</button>
    </div>
  </div>
  <p class="instructions">Click a cell to select a word (click again to switch across/down), then type letters. Click Check or fill every cell correctly to win.</p>
</main>

<script src="../../i18n/en.js"></script>
<script src="../../i18n/es.js"></script>
<script src="../../i18n/ru.js"></script>
<script src="../../i18n/ro.js"></script>
<script src="../../i18n/fr.js"></script>
<script src="../../i18n/de.js"></script>
<script src="../../js/i18n.js"></script>
<script src="../../js/common.js"></script>
<script src="../../js/friends.js"></script>
<script src="game.js"></script>
</body>
</html>
