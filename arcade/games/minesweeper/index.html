<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>Minesweeper — Claude Arc Games</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💣</text></svg>">
<link rel="stylesheet" href="../../css/main.css">
<!-- mobile-meta -->
<meta name="theme-color" content="#0f1220">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ArcGames">
<link rel="manifest" href="../../manifest.json">
<link rel="apple-touch-icon" href="../../icons/icon-192.png">
<!-- /mobile-meta -->
<script>window.ARCADE_ROOT_DEPTH = 2;</script>
<style>
  #board { grid-template-columns: repeat(9, 38px); grid-template-rows: repeat(9, 38px); }
  #board .cell { font-size: 1.1rem; border-radius: 4px; }
  #board .cell.revealed { background: var(--bg-alt); cursor: default; box-shadow: inset 0 0 6px rgba(41,224,201,0.16); }
  #board .cell.mine { background: var(--danger); box-shadow: 0 0 12px var(--danger); }
  #board .cell.flagged { background: var(--warn); box-shadow: 0 0 10px rgba(255,184,77,0.6); }
</style>
</head>
<body>
<main class="game-shell">
  <div class="game-topbar">
    <a class="back-link" href="../../index.html">← <span data-i18n="back.toArcade">Back to Arcade</span></a>
    <h1>💣 Minesweeper</h1>
    <div class="hud">
      <span class="stat">🚩: <b id="mines">10</b></span>
      <span class="stat"><span data-i18n="common.time">Time</span>: <b id="time">0</b></span>
      <span class="stat"><span data-i18n="common.best">Best</span>: <b id="best">-</b></span>
    </div>
  </div>
  <div class="game-stage">
    <div class="difficulty-row" id="difficulty"></div>
    <div class="controls-row">
      <button class="chip" id="flag-mode">🚩 Flag Mode: Off</button>
    </div>
    <div class="grid-board" id="board"></div>
    <div id="result-banner"></div>
    <div class="controls-row">
      <button class="btn btn-primary" id="restart" data-i18n="common.newGame">New Game</button>
    </div>
  </div>
  <p class="instructions">Left-click (tap) to reveal a cell, right-click to flag a suspected mine. On touch devices, turn on Flag Mode to flag with a tap instead. Reveal every safe cell to win.</p>
</main>

<script src="../../i18n/en.js"></script>
<script src="../../i18n/es.js"></script>
<script src="../../i18n/ru.js"></script>
<script src="../../i18n/ro.js"></script>
<script src="../../i18n/fr.js"></script>
<script src="../../i18n/de.js"></script>
<script src="../../js/i18n.js"></script>
<script src="../../js/common.js"></script>
<script src="../../js/friends.js"></script>
<script src="game.js"></script>
</body>
</html>
