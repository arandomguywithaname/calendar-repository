<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>Memory Match — Claude Arc Games</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🃏</text></svg>">
<link rel="stylesheet" href="../../css/main.css">
<!-- mobile-meta -->
<meta name="theme-color" content="#0f1220">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ArcGames">
<link rel="manifest" href="../../manifest.json">
<link rel="apple-touch-icon" href="../../icons/icon-192.png">
<!-- /mobile-meta -->
<script>window.ARCADE_ROOT_DEPTH = 2;</script>
<style>
  #board { position: relative; }
  #board .cell.back { background: linear-gradient(135deg, var(--accent-2), var(--accent)); color: rgba(255,255,255,0.85); box-shadow: 0 0 10px rgba(124,92,255,0.5); }
  #board .cell.matched { box-shadow: 0 0 14px var(--good); }
  #board .cell.flash { animation: mmflash 0.6s ease; }
  @keyframes mmflash { 0% { transform: scale(1); box-shadow: 0 0 8px var(--good); } 50% { transform: scale(1.15); box-shadow: 0 0 26px var(--good); } 100% { transform: scale(1); box-shadow: 0 0 14px var(--good); } }
  .mm-particle { position: absolute; width: 7px; height: 7px; border-radius: 50%; pointer-events: none; }
</style>
</head>
<body>
<main class="game-shell">
  <div class="game-topbar">
    <a class="back-link" href="../../index.html">← <span data-i18n="back.toArcade">Back to Arcade</span></a>
    <h1>🃏 Memory Match</h1>
    <div class="hud">
      <span class="stat"><span data-i18n="common.moves">Moves</span>: <b id="moves">0</b></span>
      <span class="stat"><span data-i18n="common.best">Best</span>: <b id="best">-</b></span>
    </div>
  </div>
  <div class="game-stage">
    <div class="difficulty-row" id="difficulty"></div>
    <div class="grid-board" id="board" style="grid-template-columns: repeat(4, 74px);"></div>
    <div id="result-banner"></div>
    <div class="controls-row">
      <button class="btn btn-primary" id="restart" data-i18n="common.newGame">New Game</button>
    </div>
  </div>
  <p class="instructions">Flip two cards at a time. Find every matching pair in as few moves as possible.</p>
</main>

<script src="../../i18n/en.js"></script>
<script src="../../i18n/es.js"></script>
<script src="../../i18n/ru.js"></script>
<script src="../../i18n/ro.js"></script>
<script src="../../i18n/fr.js"></script>
<script src="../../i18n/de.js"></script>
<script src="../../js/i18n.js"></script>
<script src="../../js/common.js"></script>
<script src="../../js/friends.js"></script>
<script src="../../js/admin.js"></script>
<script src="game.js"></script>
</body>
</html>
